name: Unzip File Automatically
on: [push]

jobs:
  unzip:
      runs-on: ubuntu-latest
          permissions:
                contents: write
                    steps:
                          - name: Checkout code
                                  uses: actions/checkout@v4

                                        - name: Unzip the file
                                                run: |
                                                          unzip FMM26-Vite-Complete-Project.zip -d extracted-folder/
                                                                    rm FMM26-Vite-Complete-Project.zip

                                                                          - name: Commit and push changes
                                                                                  run: |
                                                                                            git config --local user.email "action@github.com"
                                                                                                      git config --local user.name "GitHub Action"
                                                                                                                git add .
                                                                                                                          git commit -m "Automatically unzipped files" || echo "No changes"
                                                                                                                                    git push
